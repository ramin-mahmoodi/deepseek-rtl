<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="A transcript with a right-aligned Persian message and a left-aligned English reply with a code block">
  <rect width="1200" height="720" fill="#F4F5F8"/>
  <rect x="60" y="56" width="1080" height="608" rx="16" fill="#FFFFFF" stroke="#E6E8EE"/>

  <g font-family="Vazirmatn, 'Segoe UI', Tahoma, Arial, sans-serif">
    <text x="92" y="100" font-size="13" fill="#6B7280">Conversation</text>
    <path d="M92 122H1108" stroke="#EEF0F4"/>

    <text x="92" y="164" font-size="12" fill="#9CA3AF">You</text>
    <rect x="628" y="140" width="480" height="104" rx="14" fill="#EDF2FF"/>
    <g fill="#1F2937" font-size="15" text-anchor="end">
      <text x="1084" y="178">سلام! متن فارسی را باید از راست به چپ بخوانم.</text>
      <text x="1084" y="208">فونت وزیرمتن را هم فعال کن.</text>
    </g>

    <text x="92" y="284" font-size="12" fill="#9CA3AF">Assistant</text>
    <g fill="#1F2937" font-size="15">
      <text x="92" y="316">Every paragraph follows its own first strong character, so English stays</text>
      <text x="92" y="342">left-to-right while Persian turns right-to-left.</text>
      <text x="92" y="374" fill="#4B5563">Code keeps its own direction:</text>
    </g>

    <rect x="92" y="392" width="556" height="78" rx="10" fill="#F4F5F7" stroke="#E5E7EB"/>
    <g font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="13" fill="#374151">
      <text x="112" y="420">const direction = 'rtl'</text>
      <text x="112" y="446">// paths and terminal output stay LTR</text>
    </g>

    <g fill="#1F2937" font-size="15" text-anchor="end">
      <text x="1084" y="520">همه چیز درست کار می‌کند؛ کدها چپ‌چین می‌مانند و متن فارسی راست‌چین.</text>
      <text x="1084" y="548">حالا می‌توانم راحت بخوانم و بنویسم.</text>
    </g>

    <text x="600" y="632" font-size="12" fill="#9CA3AF" text-anchor="middle">Each block keeps its own direction · Alt + R toggles the layout</text>
  </g>
</svg>
